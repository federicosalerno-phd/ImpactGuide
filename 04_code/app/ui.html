<!DOCTYPE html>
<html lang="en" data-palette="gold-dark">
<head>
<meta charset="UTF-8"/>
<title data-t="win.title"></title>
<!-- SlantUI's stylesheets and scripts are written next to this page by
     impactguide_app.py (prepare_page) in a local copy of it: the page is
     loaded from file:// and can only link what sits beside it. -->
<link rel="stylesheet" href="ui/slantui.css"/>
<link rel="stylesheet" href="ui/app.css"/>
</head>
<body>
<div class="app at-home">

  <!-- The title band. SlantUI's titlebar.js cuts it, writes the credit line
       and wires the three buttons; the page gives the name and the mark,
       which app.css sets from ui/impactguide-mark.svg. The mark is the way
       home, from everywhere (ui/01-shell.js, showHome). -->
  <div class="titlebar">
    <div class="tbar-band"></div>
    <div class="tbar-brand">
      <div class="tbar-logo" id="tbLogo"></div>
      <span class="tbar-name"><b>Impact</b>Guide</span>
    </div>
    <div class="tbar-drag"></div>
    <div class="tbar-btns">
      <div class="wbtn wbtn-min" data-t-title="win.minimise.hint" data-icon="win-minimise"></div>
      <div class="wbtn wbtn-max" data-icon="win-maximise"></div>
      <div class="wbtn wbtn-close" data-t-title="win.close.hint" data-icon="win-close"></div>
    </div>
  </div>

  <!-- The rail, as UniGuide's: the steps of the module open, and nothing at
       home. Empty here: ui/01-shell.js writes the steps the module declares
       (MODULES). On the right, the phone (how it is linked: it opens the Phone
       panel) and the state. -->
  <div class="topbar">
    <div class="tabbar" id="rail"></div>
    <div class="tb-gap"></div>
    <div class="tb-r">
      <button class="btn btn-2 btn-sm" id="lkBtn" type="button" data-t-title="link.btn.hint"><span data-icon="phone"></span><span class="btn-label" id="lkBtnL"></span></button>
      <div class="stpill" id="pill"><div class="sd" id="sd"></div><span id="st"></span></div>
    </div>
  </div>

  <div class="work">
    <div class="main">

      <!-- One toolbar for the modules; a step shows its own group. Hidden at home. -->
      <div class="toolbar">
        <div class="tool-group" data-for="live-view">
          <button class="btn btn-2 btn-sm layer-btn" data-layer="face" data-t="live.layer.face"></button>
          <button class="btn btn-2 btn-sm layer-btn" data-layer="mandible" data-t="live.layer.mandible"></button>
          <button class="btn btn-2 btn-sm layer-btn" data-layer="axes" data-t="live.layer.axes"></button>
        </div>
        <span class="cthint" id="hint"></span>
        <span class="chip chip-warn hidden" id="simChip" data-t="win.simulation"></span>
        <span class="ct-fname fit" id="where"></span>
      </div>

      <div class="stage">

        <!-- ── home: the start, as UniGuide's entry. Four large choices, the
             state of the bench, the language (ui/05-home.js) ───────────── -->
        <div class="view home-view" data-view="home">
          <div class="home">
            <div class="home-top">
              <div class="home-titles">
                <div class="home-hd" data-t="home.title"></div>
                <div class="home-sub" data-t="home.sub"></div>
              </div>
              <div class="picker" id="lang" tabindex="0" data-t-title="win.lang.hint"></div>
            </div>
            <div class="choices home-choices" style="--cols:2">
              <button class="choice" type="button" data-go="calibration"><span data-icon="board"></span><span class="choice-name" data-t="home.cal"></span><span class="choice-line" data-t="home.cal.sub"></span></button>
              <button class="choice" type="button" data-go="live"><span data-icon="camera"></span><span class="choice-name" data-t="home.live"></span><span class="choice-line" data-t="home.live.sub"></span></button>
              <button class="choice" type="button" data-go="trials"><span data-icon="pendulum"></span><span class="choice-name" data-t="home.trials"></span><span class="choice-line" data-t="home.trials.sub"></span></button>
              <button class="choice" type="button" data-go="results"><span data-icon="results"></span><span class="choice-name" data-t="home.scans"></span><span class="choice-line" data-t="home.scans.sub"></span></button>
            </div>
            <div class="stcells home-cells" style="--cols:3">
              <button class="stcell" type="button" id="hsPhone" data-t-title="link.btn.hint"><span class="sd"></span><span class="stcell-l" data-t="home.st.phone"></span><span class="stcell-v"></span></button>
              <div class="stcell" id="hsCal"><span class="sd"></span><span class="stcell-l" data-t="home.st.cal"></span><span class="stcell-v"></span></div>
              <div class="stcell" id="hsTrial"><span class="sd"></span><span class="stcell-l" data-t="home.st.trial"></span><span class="stcell-v"></span></div>
            </div>
          </div>
        </div>

        <!-- ── the board, the first step of Calibrate the phone and of Live AR:
             where it is and how large, in one card (ui/15-board.js) ──────── -->
        <div class="view board-view" data-view="board">
          <div class="sheet-col">
            <div class="say card" id="bdCard">
              <div class="say-top"><span class="live-dot" id="bdDot"></span><span class="say-title" id="bdTitle"></span></div>
              <div class="say-line" id="bdLine"></div>
              <div class="say-hint" id="bdHint"></div>
            </div>
          </div>
        </div>

        <!-- ── calibration, the photos: how many, and when they are enough ─── -->
        <div class="view" data-view="cal-photos">
          <div class="sheet-col">
            <div class="count card" id="cpCard">
              <div class="count-n"><span id="cpN">0</span><span class="count-of" id="cpOf"></span></div>
              <div class="progress-track"><div class="progress-fill" id="cpBar"></div></div>
              <div class="count-say" id="cpSay"></div>
              <div class="say-hint" id="cpTip"></div>
              <div class="callout callout-warn hidden" id="cpNote"></div>
            </div>
            <div class="cp-last hidden" id="cpLast"><img id="cpImg" alt=""/></div>
          </div>
        </div>

        <!-- ── calibration, the result: one plain line ─────────────────── -->
        <div class="view" data-view="cal-result">
          <div class="sheet-col">
            <div class="say card" id="crCard">
              <div class="say-top"><span class="live-dot" id="crDot"></span><span class="say-title" id="crTitle"></span></div>
              <div class="say-line" id="crLine"></div>
            </div>
            <div class="log tall hidden" id="calLog"></div>
          </div>
        </div>

        <!-- ── live AR: the stream as the backend composes it, at its 4:3,
             with what is not real yet and the status light laid over it ── -->
        <div class="view live-view" data-view="live">
          <div class="live-stage">
            <div class="live-frame">
              <img class="live-img hidden" id="lvImg" alt=""/>
              <div class="covl live-tags hidden" id="lvTags"></div>
              <div class="covl live-lights hidden" id="lvLights">
                <div class="live-light"><span class="live-dot" id="lvDot"></span><span id="lvLight"></span></div>
                <div class="live-why hidden" id="lvWhy"></div>
              </div>
              <div class="live-idle" id="lvIdle">
                <div class="say card">
                  <div class="say-top"><span class="say-title" id="lvIdleTitle"></span></div>
                  <div class="say-line" id="lvIdleText"></div>
                  <div class="row" id="lvIdleWait"><span class="spinner spinner-sm"></span><span class="note" data-t="live.idle.starting"></span></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- ── trials: the guide ───────────────────────────────────────── -->
        <div class="view narrowable" data-view="trials-guide">
          <div class="sheet-col fill" id="guide">
            <div class="trial-head">
              <div class="trial-id" id="gId"></div>
              <div class="col grow">
                <div class="trial-sub" id="gSub"></div>
                <div class="row wrap" id="gChips"></div>
              </div>
            </div>
            <div class="tiles" id="gTiles"></div>
            <div class="col" id="gWarn"></div>
            <div class="split">
              <div class="split-main">
                <div class="now card" id="gNow">
                  <div class="now-n" id="gNowN"></div>
                  <div class="now-t" id="gNowT"></div>
                  <div class="now-x" id="gNowX"></div>
                  <div class="preview hidden" id="gPrev"></div>
                </div>
              </div>
              <div class="split-side">
                <div class="sec-lbl" data-t="trials.steps.sec"></div>
                <div class="mlist slim" id="gSteps"></div>
              </div>
            </div>
          </div>
          <div class="sheet-col hidden" id="guideDone">
            <div class="say card">
              <div class="say-top"><span class="say-title" data-t="trials.complete.title"></span></div>
              <div class="say-line" data-t="trials.complete.sub"></div>
            </div>
          </div>
        </div>

        <!-- ── trials: the log ─────────────────────────────────────────── -->
        <div class="view narrowable" data-view="trials-log">
          <div class="sheet-col fill">
            <div class="split">
              <div class="split-main">
                <div class="mlist slim" id="logList"></div>
                <div class="note" id="logNote"></div>
              </div>
              <div class="split-side">
                <div class="card col">
                  <div class="sec-lbl" id="lgDetail" data-t="log.detail"></div>
                  <div id="lgFields"></div>
                </div>
                <div class="card col">
                  <div class="sec-lbl" data-t="log.edits.sec"></div>
                  <div class="stack" id="lgEdits"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- ── trials: the sequence ────────────────────────────────────── -->
        <div class="view" data-view="trials-sequence">
          <div class="sheet-col">
            <div class="seq-grid" id="seqList"></div>
          </div>
        </div>

        <!-- ── trials: the setup ───────────────────────────────────────── -->
        <div class="view narrowable" data-view="trials-config">
          <div class="sheet-col">
            <div class="cards2">
              <div class="card col">
                <div class="sec-lbl" data-t="cfg.totals.sec"></div>
                <div id="cfgTotals"></div>
              </div>
              <div class="card col">
                <div class="sec-lbl" data-t="cfg.history.sec"></div>
                <div id="cfgHistory"></div>
              </div>
            </div>
            <div class="card col">
              <div class="sec-lbl" data-t="cfg.check.sec"></div>
              <div class="row">
                <label class="toggle grow" data-t-title="cfg.check.deep.hint"><input type="checkbox" id="chkDeep"/><span data-t="cfg.check.deep"></span></label>
                <button class="btn btn-2" id="chkRun"><span class="btn-label" data-t="cfg.check.action"></span></button>
              </div>
              <div class="log tall" id="chkLog"></div>
            </div>
          </div>
        </div>

        <!-- ── scans and results: the steps still to come ──────────────── -->
        <div class="view" data-view="soon">
          <div class="sheet-col">
            <div class="say card">
              <div class="say-top"><span class="say-title" id="soonTitle"></span></div>
              <div class="say-line" id="soonText"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ══ the panel down the right: one page per step, the current one
         carries .show. The common case in plain view; what is rarely needed
         under Advanced, closed until asked for (ui/01-shell.js, wireAdvanced).
         The Phone panel takes its place while it is open, at home too: part
         of the window, never laid over the page. -->
    <div class="rp">

      <!-- the phone: how it is linked, found by itself; Wi-Fi pairing when wanted -->
      <div class="rp-page" data-panel="phone">
        <div class="rp-hd rp-hd-x">
          <div class="rp-title" data-t="link.title"></div>
          <div class="rp-sub" data-t="link.sub"></div>
          <button class="ct rp-x" type="button" id="lkClose" data-t-title="link.close.hint"><span data-icon="win-close"></span></button>
        </div>
        <div class="rp-scroll stack">
          <div class="live-state"><span class="live-dot" id="lkDot"></span><span class="lk-word" id="lkWord"></span></div>
          <div class="note" id="lkWhy"></div>
          <div id="lkRows"></div>
          <button class="btn btn-2 btn-wide" id="lkWifi" data-t-title="link.wifi.hint"><span class="btn-label" data-t="link.wifi.action"></span></button>
          <!-- Wi-Fi pairing, once per PC, only when asked for -->
          <div class="stack hidden" id="lkPair">
            <div class="sec-lbl" data-t="link.pair.sec"></div>
            <div class="lk-step" id="lkS1" data-t-title="link.pair.s1.hint"><span class="tn">1</span><span data-t="link.pair.s1"></span></div>
            <div class="lk-step" id="lkS2"><span class="tn">2</span><span data-t="link.pair.s2"></span></div>
            <div class="lk-step"><span class="tn" id="lkS3n">3</span><span data-t="link.pair.s3"></span></div>
            <div class="lk-qr" id="lkQr"></div>
            <div class="row hidden" id="lkQrWait"><span class="spinner spinner-sm"></span><span class="note" data-t="link.pair.qr.wait"></span></div>
            <button class="btn btn-2 btn-wide" id="lkQrBtn"><span class="btn-label" data-t="link.pair.qr.new"></span></button>
          </div>
          <!-- the live view on the phone's own screen -->
          <div class="sec-lbl" data-t="view.sec"></div>
          <button class="btn btn-2 btn-wide" id="vwOpen" data-t-title="view.open.hint"><span data-icon="play"></span><span class="btn-label" data-t="view.open"></span></button>
          <div id="vwRows"></div>
          <div class="fold" id="lkAdv"><button class="fold-hd" type="button"><span class="fold-name" data-t="word.advanced"></span></button><div class="fold-body"><div class="stack">
            <div id="lkMore"></div>
            <button class="btn btn-2 btn-wide" id="lkWifiAgain" data-t-title="link.wifi.hint"><span class="btn-label" data-t="link.wifi.again"></span></button>
            <!-- Wi-Fi: pairing with a code, and connecting by address -->
            <div class="sec-lbl" data-t="link.pair.code.sec"></div>
            <input class="input" type="text" id="lkPairAddr" data-t-ph="link.pair.addr.ph" data-t-title="link.pair.or"/>
            <input class="input" type="text" id="lkPairCode" inputmode="numeric" maxlength="7" data-t-ph="link.pair.code.ph"/>
            <button class="btn btn-2 btn-wide" id="lkPairBtn"><span class="btn-label" data-t="link.pair.action"></span></button>
            <div class="sec-lbl" data-t="link.connect.sec"></div>
            <input class="input" type="text" id="lkAddr" data-t-ph="link.connect.ph" data-t-title="link.connect.note"/>
            <button class="btn btn-2 btn-wide" id="lkConnect"><span class="btn-label" data-t="link.connect.action"></span></button>
            <!-- another screen on the same network: the code to scan -->
            <div class="sec-lbl" data-t="view.other.sec"></div>
            <div class="lk-qr" id="vwQr" data-t-title="view.firewall"></div>
            <div class="note" data-t="view.qr.note"></div>
            <div class="note note-path" id="vwUrl"></div>
            <div id="vwMore"></div>
          </div></div></div>
        </div>
      </div>

      <!-- calibration 1: the board -->
      <div class="rp-page" data-panel="cal-board">
        <div class="rp-hd">
          <div class="rp-title" data-t="cal.board.title"></div>
          <div class="rp-sub" data-t="cal.board.sub"></div>
        </div>
        <div class="rp-scroll stack">
          <div class="stack" id="calBd">
            <div class="mlist" id="calBdKinds">
              <div class="mitem" data-kind="screen" tabindex="0" role="button"><span class="mitem-name" data-t="board.kind.screen"></span></div>
              <div class="mitem" data-kind="printed" tabindex="0" role="button"><span class="mitem-name" data-t="board.kind.printed"></span></div>
            </div>
            <div id="calBdSquare"></div>
            <div class="callout callout-warn hidden" id="calBdWarn"></div>
            <button class="btn btn-2 btn-wide" id="calBdShow"><span data-icon="screen"></span><span class="btn-label" data-t="board.show"></span></button>
            <div class="stack" id="calBdPrinted">
              <div class="sec-lbl" data-t="cal.square.sec"></div>
              <div class="row" data-t-title="cal.square.hint">
                <input class="input" type="number" id="calBdLong" min="50" max="1100" step="0.1"/>
                <span class="input-unit">mm</span>
              </div>
            </div>
          </div>
          <div class="fold" id="calAdv"><button class="fold-hd" type="button"><span class="fold-name" data-t="word.advanced"></span></button><div class="fold-body"><div class="stack">
            <div class="stack" id="calBdMore">
              <div class="sec-lbl" data-t="board.place.sec"></div>
              <div class="mlist" id="calBdPlaces">
                <div class="mitem" data-place="beside" tabindex="0" role="button"><span class="mitem-name" data-t="board.place.beside"></span></div>
                <div class="mitem" data-place="full" tabindex="0" role="button"><span class="mitem-name" data-t="board.place.full"></span></div>
              </div>
              <button class="btn btn-2 btn-wide hidden" id="calBdDock"><span class="btn-label" data-t="board.dock"></span></button>
              <div class="sec-lbl" data-t="board.monitor.sec"></div>
              <div class="combo" id="calBdMonitor" tabindex="0" role="button"><span class="combo-v"></span></div>
              <div id="calBdRows"></div>
              <div class="note" id="calBdSure"></div>
              <div class="sec-lbl" data-t="board.ruler.sec"></div>
              <div class="row" data-t-title="board.ruler.hint">
                <input class="input" type="number" id="calBdRuler" min="50" max="2000" step="0.1"/>
                <span class="input-unit">mm</span>
              </div>
              <div class="note" id="calBdRulerNote"></div>
              <button class="btn btn-2 btn-wide hidden" id="calBdForget"><span class="btn-label" data-t="board.ruler.forget"></span></button>
            </div>
            <div class="stack" id="calBoardPrint">
              <div class="sec-lbl" data-t="cal.board.sec"></div>
              <div id="calBoard"></div>
              <button class="btn btn-2 btn-wide" id="calBoardBtn"><span class="btn-label" data-t="cal.board.action"></span></button>
              <button class="btn btn-2 btn-wide" id="calBoardOpen"><span class="btn-label" data-t="cal.board.open"></span></button>
            </div>
          </div></div></div>
        </div>
        <div class="rp-foot">
          <div class="rp-nav">
            <button class="btn btn-primary btn-grow" data-step="photos"><span class="btn-label" data-t="word.next"></span><span data-icon="chevron-right"></span></button>
          </div>
        </div>
      </div>

      <!-- calibration 2: the photos -->
      <div class="rp-page" data-panel="cal-photos">
        <div class="rp-hd">
          <div class="rp-title" data-t="cal.photos.title"></div>
          <div class="rp-sub" id="calPhotosSub"></div>
        </div>
        <div class="rp-scroll stack">
          <button class="btn btn-primary btn-wide" id="calTake"><span data-icon="camera"></span><span class="btn-label" data-t="cal.take"></span></button>
          <div class="stack hidden" id="calNeedBoard">
            <div class="callout callout-warn" data-t="cal.need.board"></div>
            <button class="btn btn-2 btn-wide" id="calNeedShow"><span data-icon="screen"></span><span class="btn-label" data-t="board.show"></span></button>
          </div>
          <div class="fold" id="calPhAdv"><button class="fold-hd" type="button"><span class="fold-name" data-t="word.advanced"></span></button><div class="fold-body"><div class="stack">
            <div class="sec-lbl" data-t="cal.mode.sec"></div>
            <div class="combo" id="calMode" tabindex="0" role="button"><span class="combo-v"></span></div>
            <label class="toggle" data-t-title="cal.kind.check.hint"><input type="checkbox" id="calKind"/><span data-t="cal.kind.check"></span></label>
            <div class="sec-lbl" data-t="cal.folder.sec"></div>
            <div class="note note-path" id="calFolder"></div>
            <button class="btn btn-2 btn-wide" id="calImport"><span class="btn-label" data-t="cal.photos.import"></span></button>
            <button class="btn btn-2 btn-wide" id="calOpen"><span class="btn-label" data-t="cal.photos.open"></span></button>
            <button class="btn btn-2 btn-wide" id="calNew"><span class="btn-label" data-t="cal.series.new"></span></button>
          </div></div></div>
        </div>
        <div class="rp-foot">
          <div class="rp-nav">
            <button class="btn btn-2 btn-sq" data-step="board" data-t-title="word.back"><span data-icon="chevron-left"></span></button>
            <button class="btn btn-2 btn-grow" id="calNext" data-step="result"><span class="btn-label" data-t="word.next"></span><span data-icon="chevron-right"></span></button>
          </div>
        </div>
      </div>

      <!-- calibration 3: the calibration and its result -->
      <div class="rp-page" data-panel="cal-result">
        <div class="rp-hd">
          <div class="rp-title" id="calResTitle"></div>
          <div class="rp-sub" id="calResSub"></div>
        </div>
        <div class="rp-scroll stack">
          <div class="sec-lbl" data-t="cal.stored.sec"></div>
          <div id="calModes"></div>
          <div class="fold" id="calResAdv"><button class="fold-hd" type="button"><span class="fold-name" data-t="word.advanced"></span></button><div class="fold-body"><div class="stack">
            <label class="toggle" data-t-title="cal.log.hint"><input type="checkbox" id="calShowLog"/><span data-t="cal.log.show"></span></label>
          </div></div></div>
        </div>
        <div class="rp-foot">
          <div class="rp-nav">
            <button class="btn btn-2 btn-sq" data-step="photos" data-t-title="word.back"><span data-icon="chevron-left"></span></button>
            <button class="btn btn-primary btn-grow" id="calRun"><span class="btn-label" id="calRunL"></span></button>
          </div>
        </div>
      </div>

      <!-- live AR 1: the board the phone follows -->
      <div class="rp-page" data-panel="live-board">
        <div class="rp-hd">
          <div class="rp-title" data-t="live.board.title"></div>
          <div class="rp-sub" data-t="live.board.sub"></div>
        </div>
        <div class="rp-scroll stack">
          <div class="mlist" id="lvBoards">
            <div class="mitem" data-board="patient" tabindex="0" role="button"><span class="mitem-name" data-t="live.board.patient"></span></div>
            <div class="mitem" data-board="sheet" tabindex="0" role="button"><span class="mitem-name" data-t="live.board.sheet"></span></div>
          </div>
          <div class="stack" id="lvBd">
            <div class="mlist" id="lvBdKinds">
              <div class="mitem" data-kind="screen" tabindex="0" role="button"><span class="mitem-name" data-t="board.kind.screen"></span></div>
              <div class="mitem" data-kind="printed" tabindex="0" role="button"><span class="mitem-name" data-t="board.kind.printed"></span></div>
            </div>
            <div id="lvBdSquare"></div>
            <div class="callout callout-warn hidden" id="lvBdWarn"></div>
            <button class="btn btn-2 btn-wide" id="lvBdShow"><span data-icon="screen"></span><span class="btn-label" data-t="board.show"></span></button>
            <div class="stack" id="lvBdPrinted">
              <div class="sec-lbl" data-t="cal.square.sec"></div>
              <div class="row" data-t-title="cal.square.hint">
                <input class="input" type="number" id="lvBdLong" min="50" max="1100" step="0.1"/>

              </div>
            </div>
          </div>
          <div class="fold" id="lvBdAdv"><button class="fold-hd" type="button"><span class="fold-name" data-t="word.advanced"></span></button><div class="fold-body"><div class="stack">
            <div class="stack" id="lvBdMore">
              <div class="sec-lbl" data-t="board.place.sec"></div>
              <div class="mlist" id="lvBdPlaces">
                <div class="mitem" data-place="beside" tabindex="0" role="button"><span class="mitem-name" data-t="board.place.beside"></span></div>
                <div class="mitem" data-place="full" tabindex="0" role="button"><span class="mitem-name" data-t="board.place.full"></span></div>
              </div>
              <button class="btn btn-2 btn-wide hidden" id="lvBdDock"><span class="btn-label" data-t="board.dock"></span></button>
              <div class="sec-lbl" data-t="board.monitor.sec"></div>
              <div class="combo" id="lvBdMonitor" tabindex="0" role="button"><span class="combo-v"></span></div>
              <div id="lvBdRows"></div>
              <div class="note" id="lvBdSure"></div>
              <div class="sec-lbl" data-t="board.ruler.sec"></div>
              <div class="row" data-t-title="board.ruler.hint">
                <input class="input" type="number" id="lvBdRuler" min="50" max="2000" step="0.1"/>
                <span class="input-unit">mm</span>
              </div>
              <div class="note" id="lvBdRulerNote"></div>
              <button class="btn btn-2 btn-wide hidden" id="lvBdForget"><span class="btn-label" data-t="board.ruler.forget"></span></button>
            </div>
          </div></div></div>
        </div>
        <div class="rp-foot">
          <div class="rp-nav">
            <button class="btn btn-primary btn-grow" data-step="view"><span class="btn-label" data-t="word.next"></span><span data-icon="chevron-right"></span></button>
          </div>
        </div>
      </div>

      <!-- live AR 2: the view -->
      <div class="rp-page" data-panel="live">
        <div class="rp-hd">
          <div class="rp-title" data-t="page.live.title"></div>
          <div class="rp-sub" data-t="page.live.sub"></div>
        </div>
        <div class="rp-scroll stack">
          <div class="sec-lbl" data-t="live.overlay.sec"></div>
          <div class="slrow" data-t-title="live.opacity.hint">
            <span class="sl-l" data-t="live.opacity"></span>
            <input type="range" id="lvOpacity" min="0" max="1" step="0.05" value="0.3"/>
            <span class="sl-v" id="lvOpacityV"></span>
          </div>
          <div class="fold" id="lvAdv"><button class="fold-hd" type="button"><span class="fold-name" data-t="word.advanced"></span></button><div class="fold-body"><div class="stack">
            <div class="sec-lbl" id="lvStatusLbl" data-t="live.status.sec"></div>
            <div id="lvStatus"></div>
            <div class="sec-lbl" data-t="live.reg.sec"></div>
            <div id="lvReg"></div>
            <button class="btn btn-2 btn-wide" id="lvRegLoad" data-t-title="live.reg.load.hint"><span class="btn-label" data-t="live.reg.load"></span></button>
            <button class="btn btn-2 btn-wide" id="lvRegDemo"><span class="btn-label" data-t="live.reg.demo"></span></button>
            <div class="sec-lbl" data-t="live.cam.sec"></div>
            <div id="lvCam"></div>
          </div></div></div>
        </div>
        <div class="rp-foot">

            <button class="btn btn-2 btn-sq" data-step="board" data-t-title="word.back"><span data-icon="chevron-left"></span></button>
            <button class="btn btn-2 btn-grow hidden" id="lvStop"><span data-icon="stop"></span><span class="btn-label" data-t="live.stop"></span></button>
            <button class="btn btn-primary btn-grow" id="lvStart"><span data-icon="play"></span><span class="btn-label" data-t="live.start"></span></button>
          </div>
        </div>
      </div>

      <div class="rp-page" data-panel="trials-plan">
        <div class="rp-hd">
          <div class="rp-title" data-t="trials.plan.title"></div>
          <div class="rp-sub" id="planSub"></div>
        </div>
        <div class="rp-scroll stack">
          <div class="sec-lbl" data-t="trials.plan.mass.sec"></div>
          <div class="row" data-t-title="trials.plan.mass.hint">
            <input class="input" type="number" id="planMass" min="1" step="0.1"/>
            <span class="input-unit">g</span>
          </div>
          <div class="fold" id="planAdv"><button class="fold-hd" type="button"><span class="fold-name" data-t="word.advanced"></span></button><div class="fold-body"><div class="stack">
            <label class="toggle" data-t-title="trials.plan.reference.hint"><input type="checkbox" id="planRef"/><span data-t="trials.plan.reference"></span></label>
            <div class="sec-lbl" data-t="trials.plan.extra.sec"></div>
            <div class="stack hidden" id="extraForm">
              <div class="combo" id="exHolder" tabindex="0" role="button"><span class="combo-v"></span></div>
              <div class="combo" id="exAngle" tabindex="0" role="button"><span class="combo-v"></span></div>
              <div class="combo" id="exDir" tabindex="0" role="button"><span class="combo-v"></span></div>
              <label class="toggle"><input type="checkbox" id="exDrape"/><span data-t="trials.tile.drape"></span></label>
              <div class="row">
                <button class="btn btn-2 grow" id="exApply"><span class="btn-label" data-t="trials.plan.extra.apply"></span></button>
                <button class="btn btn-2 grow" id="exCancel"><span class="btn-label" data-t="trials.plan.extra.cancel"></span></button>
              </div>
            </div>
            <button class="btn btn-2 btn-wide" id="extraBtn" data-t-title="trials.plan.extra.hint"><span class="btn-label" data-t="trials.plan.extra.action"></span></button>
            <div class="sec-lbl" data-t="trials.scanner.sec"></div>
            <div class="note note-path" id="planScanner"></div>
            <button class="btn btn-2 btn-wide" id="planScannerBtn"><span class="btn-label" data-t="trials.scanner.choose"></span></button>
          </div></div></div>
        </div>
        <div class="rp-foot">
          <button class="btn btn-primary btn-wide" id="planStart"><span data-icon="play"></span><span class="btn-label" id="planStartL"></span></button>
        </div>
      </div>

      <!-- trials: a step of the open trial -->
      <div class="rp-page" data-panel="trials-step">
        <div class="rp-hd">
          <div class="rp-title" id="stTitle"></div>
          <div class="rp-sub" id="stSub"></div>
        </div>
        <div class="rp-scroll stack" id="stBody">
          <div class="stack hidden" data-kind="photo">
            <button class="btn btn-2 btn-wide" id="stShoot"><span data-icon="camera"></span><span class="btn-label" data-t="step.ctl.shoot"></span></button>
          </div>
          <div class="stack hidden" data-kind="video">
            <button class="btn btn-2 btn-wide" id="stRec"><span data-icon="play"></span><span class="btn-label" id="stRecL"></span></button>
          </div>
          <div class="stack hidden" data-kind="scan">
            <div class="row" id="stWait"><span class="spinner spinner-sm"></span><span class="note" data-t="step.ctl.waiting"></span></div>
            <button class="btn btn-2 btn-wide" id="stScannerBtn"><span class="btn-label" data-t="trials.scanner.choose"></span></button>
          </div>
          <div class="stack hidden" data-kind="highspeed">
            <button class="btn btn-2 btn-wide" id="stImportHs"><span class="btn-label" data-t="step.ctl.import"></span></button>
          </div>
          <div class="stack hidden" data-kind="staged">
            <button class="btn btn-2 btn-wide" id="stDiscard"><span class="btn-label" data-t="step.ctl.discard"></span></button>
          </div>
          <div class="stack hidden" data-kind="spheres">
            <label class="toggle"><input type="checkbox" id="stSpheres"/><span data-t="step.ctl.spheres"></span></label>
            <div class="sec-lbl" data-t="step.ctl.capshift.sec"></div>
            <div class="row" data-t-title="step.ctl.capshift.hint">
              <input class="input" type="number" id="stShift" min="0" step="0.01"/>
              <span class="input-unit">mm</span>
            </div>
          </div>
          <div class="stack hidden" data-kind="close">
            <label class="toggle"><input type="checkbox" id="stSecond"/><span data-t="step.ctl.second"></span></label>
            <label class="toggle"><input type="checkbox" id="stCap"/><span data-t="step.ctl.cap"></span></label>
            <div class="sec-lbl" data-t="step.ctl.notes.sec"></div>
            <textarea class="input" id="stNotes" rows="3"></textarea>
          </div>
          <div class="fold" id="stAdv"><button class="fold-hd" type="button"><span class="fold-name" data-t="word.advanced"></span></button><div class="fold-body"><div class="stack">
            <button class="btn btn-2 btn-wide" id="stImport"><span class="btn-label" data-t="step.ctl.import"></span></button>
            <div class="sec-lbl" data-t="trials.scanner.sec"></div>
            <div class="note note-path" id="stScanner"></div>
            <button class="btn btn-2 btn-wide" id="stScannerBtn2"><span class="btn-label" data-t="trials.scanner.choose"></span></button>
            <div class="sec-lbl" data-t="step.ctl.void.sec"></div>
            <input class="input" type="text" id="stVoidReason" data-t-ph="step.ctl.void.ph"/>
            <button class="btn btn-danger btn-wide" id="stVoid"><span class="btn-label" data-t="step.ctl.void.action"></span></button>
          </div></div></div>
        </div>
        <div class="rp-foot">
          <div class="rp-nav">
            <button class="btn btn-2 btn-sq" id="stBack" data-t-title="step.back.hint"><span data-icon="chevron-left"></span></button>
            <button class="btn btn-primary btn-grow" id="stOk"><span class="btn-label" id="stOkL"></span><span data-icon="chevron-right"></span></button>
          </div>
        </div>
      </div>

      <!-- trials: the log -->
      <div class="rp-page" data-panel="trials-log">
        <div class="rp-hd">
          <div class="rp-title" id="lgTitle"></div>
          <div class="rp-sub" id="lgSub"></div>

          <input class="input" type="text" id="lgValue" data-t-ph="log.edit.value"/>

          <button class="btn btn-2 btn-wide" id="lgSave"><span class="btn-label" data-t="log.edit.action"></span></button>
          <div class="fold" id="lgAdv"><button class="fold-hd" type="button"><span class="fold-name" data-t="word.advanced"></span></button><div class="fold-body"><div class="stack">
            <div class="sec-lbl" id="lgVoidLbl" data-t="step.ctl.void.sec"></div>

          </div></div></div>
        </div>
        <div class="rp-foot">
          <button class="btn btn-2 btn-wide" id="lgOpen"><span data-icon="open"></span><span class="btn-label" data-t="log.open.action"></span></button>
        </div>
      </div>

      <div class="rp-page" data-panel="trials-sequence">
        <div class="rp-hd">
          <div class="rp-title" data-t="trials.view.sequence"></div>
          <div class="rp-sub" data-t="seq.sub"></div>

      <div class="rp-page" data-panel="trials-config">

          <div class="rp-sub" data-t="cfg.sub"></div>

        <div class="rp-scroll stack">
          <div class="sec-lbl" data-t="cfg.phase"></div>
          <div class="combo" id="cfgPhase" tabindex="0" role="button"><span class="combo-v"></span></div>
          <div class="sec-lbl" data-t="cfg.holders"></div>
          <input class="input" type="text" id="cfgHolders"/>

          <input class="input" type="text" id="cfgAngles"/>

          <input class="input" type="text" id="cfgDirections"/>
          <div class="cfg-pair">
            <div class="col"><div class="sec-lbl" data-t="cfg.repetitions"></div><input class="input" type="number" id="cfgReps" min="1" step="1"/></div>
            <div class="col"><div class="sec-lbl" data-t="cfg.drape"></div><input class="input" type="number" id="cfgDrape" min="0" step="1"/></div>
          </div>
          <div class="note" id="cfgPreview"></div>
          <div class="fold" id="cfgAdv"><button class="fold-hd" type="button"><span class="fold-name" data-t="word.advanced"></span></button><div class="fold-body"><div class="stack">
            <div class="sec-lbl" data-t="cfg.order"></div>

              <div class="col"><div class="sec-lbl" data-t="cfg.seed"></div><input class="input" type="number" id="cfgSeed" step="1"/></div>
            </div>
            <div class="cfg-pair">
              <div class="col"><div class="sec-lbl" data-t="cfg.washers"></div><input class="input" type="number" id="cfgWashers" min="0" step="1"/></div>
              <div class="col"><div class="sec-lbl" data-t="cfg.reposition"></div><input class="input" type="number" id="cfgRepos" min="0.1" step="0.1"/></div>
            </div>
            <label class="toggle"><input type="checkbox" id="cfgHigh"/><span data-t="cfg.highspeed"></span></label>
          </div></div></div>
        </div>
        <div class="rp-foot">
          <button class="btn btn-2 btn-wide" id="cfgReset"><span data-icon="reset"></span><span class="btn-label" data-t="cfg.reset"></span></button>
          <button class="btn btn-primary btn-wide" id="cfgApply"><span class="btn-label" data-t="cfg.apply"></span></button>
        </div>
      </div>
