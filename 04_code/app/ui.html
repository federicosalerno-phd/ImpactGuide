<!DOCTYPE html>
<html lang="en" data-palette="gold-dark">
<head>
<meta charset="UTF-8"/>
<title data-t="win.title"></title>
<!-- SlantUI's stylesheets and scripts are written next to this page by
     impactguide_app.py (prepare_page) in a local copy of it: the page is
     loaded from file:// and can only link what sits beside it. -->
<link rel="stylesheet" href="ui/slantui.css"/>
<link rel="stylesheet" href="ui/app.css"/>
<link rel="stylesheet" href="ui/results.css"/>
</head>
<body>
<div class="app at-home">

  <!-- The title band. SlantUI's titlebar.js cuts it, writes the credit line
       and wires the three buttons; the page gives the name and the mark,
       which app.css sets from ui/impactguide-mark.svg. The mark is the way
       home, from everywhere (ui/01-shell.js, showHome). -->
  <div class="titlebar">
    <div class="tbar-band"></div>
    <div class="tbar-brand">
      <div class="tbar-logo" id="tbLogo"></div>
      <span class="tbar-name"><b>Impact</b>Guide</span>
    </div>
    <div class="tbar-drag"></div>
    <div class="tbar-btns">
      <div class="wbtn wbtn-min" data-t-title="win.minimise.hint" data-icon="win-minimise"></div>
      <div class="wbtn wbtn-max" data-icon="win-maximise"></div>
      <div class="wbtn wbtn-close" data-t-title="win.close.hint" data-icon="win-close"></div>
    </div>
  </div>

  <!-- The rail, as UniGuide's: the steps of the module open, and nothing at
       home. Empty here: ui/01-shell.js writes the steps the module declares
       (MODULES). On the right, the phone (how it is linked: it opens the Phone
       panel) and the state. -->
  <div class="topbar">
    <div class="tabbar" id="rail"></div>
    <div class="tb-gap"></div>
    <div class="tb-r">
      <button class="btn btn-2 btn-sm" id="lkBtn" type="button" data-t-title="link.btn.hint"><span data-icon="phone"></span><span class="btn-label" id="lkBtnL"></span></button>
      <div class="stpill" id="pill"><div class="sd" id="sd"></div><span id="st"></span></div>
    </div>
  </div>

  <div class="work">
    <div class="main">

      <!-- One toolbar for the modules; a step shows its own group (.tool-group data-for="<module>-<step>").
           Hidden at home. What Live AR draws is chosen in its panel, not here. -->
      <div class="toolbar">
        <span class="cthint" id="hint"></span>
        <span class="chip chip-warn hidden" id="simChip" data-t="win.simulation"></span>
        <span class="ct-fname fit" id="where"></span>
      </div>

      <div class="stage">

        <!-- ── home: the start, as UniGuide's entry. Four large choices, the
             state of the bench, the language (ui/05-home.js) ───────────── -->
        <div class="view home-view" data-view="home">
          <div class="home">
            <div class="home-top">
              <div class="home-titles">
                <div class="home-hd" data-t="home.title"></div>
                <div class="home-sub" data-t="home.sub"></div>
              </div>
              <div class="picker" id="lang" tabindex="0" data-t-title="win.lang.hint"></div>
            </div>
            <div class="choices home-choices" style="--cols:2">
              <button class="choice" type="button" data-go="calibration"><span data-icon="board"></span><span class="choice-name" data-t="home.cal"></span><span class="choice-line" data-t="home.cal.sub"></span></button>
              <button class="choice" type="button" data-go="live"><span data-icon="camera"></span><span class="choice-name" data-t="home.live"></span><span class="choice-line" data-t="home.live.sub"></span></button>
              <button class="choice" type="button" data-go="trials"><span data-icon="trials"></span><span class="choice-name" data-t="home.trials"></span><span class="choice-line" data-t="home.trials.sub"></span></button>
              <button class="choice" type="button" data-go="results"><span data-icon="results"></span><span class="choice-name" data-t="home.scans"></span><span class="choice-line" data-t="home.scans.sub"></span></button>
            </div>
            <div class="stcells line home-cells">
              <button class="stcell" type="button" id="hsPhone" data-t-title="link.btn.hint"><span class="sd"></span><span class="stcell-l" data-t="home.st.phone"></span><span class="stcell-v"></span></button>
              <button class="stcell" type="button" id="hsCal" data-t-title="home.cal"><span class="sd"></span><span class="stcell-l" data-t="home.st.cal"></span><span class="stcell-v"></span></button>
              <button class="stcell" type="button" id="hsTrial" data-t-title="home.trials"><span class="sd"></span><span class="stcell-l" data-t="home.st.trial"></span><span class="stcell-v"></span></button>
            </div>
          </div>
        </div>

        <!-- ── the board, the first step of Calibrate the phone and of Live AR
             (ui/15-board.js). First the question: this monitor or a physical
             board. On this monitor the board itself fills the work area, drawn
             by the page at its true size (one image pixel on one screen pixel).
             Physical: the 3D-printed plate in 3D (ui/17-plate3d.js) or the A4
             sheet, beside what to do with it. ─────────────────────────── -->
        <div class="view board-view" data-view="board">
          <div class="bd-ask hidden" id="bdAsk">
            <div class="bd-ask-hd" data-t="board.ask"></div>
            <div class="choices" style="--cols:2">
              <button class="choice" type="button" data-kind="screen"><span data-icon="screen"></span><span class="choice-name" data-t="board.kind.screen"></span><span class="choice-line" data-t="board.kind.screen.sub"></span></button>
              <button class="choice" type="button" data-kind="plate"><span data-icon="board"></span><span class="choice-name" data-t="board.kind.physical"></span><span class="choice-line" data-t="board.kind.physical.sub"></span></button>
            </div>
          </div>
          <div class="bd-split hidden" id="bdSplit">
            <div class="bd-host" id="bdHostBoard"></div>
            <div class="ph-guide" id="bdGuideCol"><div class="guide" id="bdGuide"></div></div>
          </div>
          <div class="sheet-col hidden" id="bdPatient">
            <div class="say card">
              <div class="say-top"><span class="live-dot ok"></span><span class="say-title" id="bdTitle"></span></div>
              <div class="say-line" id="bdLine"></div>
              <div class="say-hint" id="bdHint"></div>
            </div>
          </div>
          <div class="bd-phys hidden" id="bdPhys">
            <div class="bd-fig">
              <div class="bd-3d" id="bd3d"><canvas id="bd3dCanvas"></canvas><div class="covl bd-3d-hint" data-t="board.3d.hint"></div></div>
              <div class="bd-sheet hidden" id="bdSheetFig"></div>
            </div>
            <div class="card bd-steps" id="bdSteps"></div>
          </div>
        </div>

        <!-- ── calibration, the photos: the board (on this monitor) or the live
             picture, beside the guide of the next photo: how to hold the phone,
             and how the last photo went ───────────────────────────────── -->
        <div class="view photos-view" data-view="cal-photos">
          <div class="ph-split">
            <div class="bd-host hidden" id="bdHostPhotos"></div>
            <div class="ph-live hidden" id="phLive"><img class="live-img" id="phLiveImg" alt=""/><div class="covl ph-live-tag hidden" id="phLiveTag"></div></div>
            <div class="ph-guide" id="phGuide">
              <div class="guide" id="phGuideFig"></div>
              <!-- the newest photos, each a small picture with its pose; its check (kept, retake) comes on it later -->
              <div class="ph-strip hidden" id="phStrip"></div>
              <div class="ph-last hidden" id="phLast">
                <div class="ph-last-w"><span class="live-dot" id="phLastDot"></span><span class="ph-last-t" id="phLastT"></span></div>
                <div class="ph-last-figs">
                  <div class="ph-last-fig"><div class="ph-shot" id="phShot"><img class="hidden" alt=""/><div class="ph-shot-pts"></div></div><div class="fig-note" data-t="cal.last.photo"></div></div>
                  <div class="ph-last-fig"><div class="ph-cov" id="phCov"></div><div class="fig-note" data-t="cal.last.all"></div></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- ── calibration, the result: the verdict, the error of each photo,
             where on the board the error is ──────────────────────────── -->
        <div class="view" data-view="cal-result">
          <div class="sheet-col">
            <div class="say card" id="crCard">
              <div class="say-top"><span class="live-dot" id="crDot"></span><span class="say-title" id="crTitle"></span></div>
              <div class="say-line" id="crLine"></div>
              <!-- what spoils it, the most serious first and in full, a cross before each -->
              <div class="say-list hidden" id="crIssues"></div>
            </div>
            <div class="cards2 res-figs hidden" id="crFigs">
              <div class="card col"><div class="sec-lbl" data-t="cal.res.photos"></div><div class="fig" id="crBars"></div><div class="fig-note" id="crBarsNote"></div></div>
              <div class="card col"><div class="sec-lbl" data-t="cal.res.board"></div><div class="fig" id="crMap"></div><div class="fig-note" id="crMapNote"></div><div class="fig-note" id="crMapRel"></div></div>
            </div>
          </div>
        </div>

        <!-- ── live AR: the stream as the backend composes it, at its 4:3, with
             what is not real yet and the status light laid over it; with the
             board on this monitor, the board beside it (hidden in the picture,
             so the phone never sees it twice) ────────────────────────── -->
        <div class="view live-view" data-view="live">
          <div class="live-split">
            <div class="bd-host hidden" id="bdHostLive"></div>
            <div class="live-stage">
              <div class="live-frame">
                <img class="live-img hidden" id="lvImg" alt=""/>
                <div class="covl live-tags hidden" id="lvTags"></div>
                <div class="covl live-lights hidden" id="lvLights">
                  <div class="live-light"><span class="live-dot" id="lvDot"></span><span id="lvLight"></span></div>
                  <div class="live-why hidden" id="lvWhy"></div>
                  <!-- the registration watched over: its state by shape and colour, and what to do -->
                  <div class="live-light chk-light hidden" id="lvChk"><span class="chk-dot" id="lvChkDot"></span><span id="lvChkWord"></span></div>
                  <div class="live-why hidden" id="lvChkWhy"></div>
                </div>
                <div class="live-idle" id="lvIdle">
                  <div class="say card">
                    <div class="say-top"><span class="say-title" id="lvIdleTitle"></span></div>
                    <div class="say-line" id="lvIdleText"></div>
                    <div class="row" id="lvIdleWait"><span class="spinner spinner-sm"></span><span class="note" data-t="live.idle.starting"></span></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- ── trials: the guide ───────────────────────────────────────── -->
        <div class="view narrowable" data-view="trials-guide">
          <div class="sheet-col fill" id="guide">
            <div class="trial-head">
              <div class="trial-id" id="gId"></div>
              <div class="col grow">
                <div class="trial-sub" id="gSub"></div>
                <div class="row wrap" id="gChips"></div>
              </div>
              <button class="btn btn-2" id="gTwin" type="button" data-t-title="twin.open.hint"><span data-icon="cube"></span><span class="btn-label" data-t="twin.open"></span></button>
            </div>
            <div class="tiles" id="gTiles"></div>
            <div class="col" id="gWarn"></div>
            <div class="split">
              <div class="split-main">
                <div class="now card" id="gNow">
                  <div class="now-n" id="gNowN"></div>
                  <div class="now-t" id="gNowT"></div>
                  <div class="now-x" id="gNowX"></div>
                  <div class="preview hidden" id="gPrev"></div>
                </div>
              </div>
              <div class="split-side">
                <div class="sec-lbl" data-t="trials.steps.sec"></div>
                <div class="mlist slim" id="gSteps"></div>
              </div>
            </div>
          </div>
          <div class="sheet-col hidden" id="guideDone">
            <div class="say card">
              <div class="say-top"><span class="say-title" data-t="trials.complete.title"></span></div>
              <div class="say-line" data-t="trials.complete.sub"></div>
            </div>
          </div>
        </div>

        <!-- ── trials: the log ─────────────────────────────────────────── -->
        <div class="view narrowable" data-view="trials-log">
          <div class="sheet-col fill">
            <div class="split">
              <div class="split-main">
                <div class="mlist slim" id="logList"></div>
                <div class="note" id="logNote"></div>
              </div>
              <div class="split-side">
                <div class="card col">
                  <div class="sec-lbl" id="lgDetail" data-t="log.detail"></div>
                  <div id="lgFields"></div>
                </div>
                <div class="card col">
                  <div class="sec-lbl" data-t="log.edits.sec"></div>
                  <div class="stack" id="lgEdits"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- ── trials: the sequence ────────────────────────────────────── -->
        <div class="view" data-view="trials-sequence">
          <div class="sheet-col">
            <div class="seq-grid" id="seqList"></div>
          </div>
        </div>

        <!-- ── trials: the setup ───────────────────────────────────────── -->
        <div class="view narrowable" data-view="trials-config">
          <div class="sheet-col">
            <div class="cards2">
              <div class="card col">
                <div class="sec-lbl" data-t="cfg.totals.sec"></div>
                <div id="cfgTotals"></div>
              </div>
              <div class="card col">
                <div class="sec-lbl" data-t="cfg.history.sec"></div>
                <div id="cfgHistory"></div>
              </div>
            </div>
            <div class="card col">
              <div class="sec-lbl" data-t="cfg.check.sec"></div>
              <div class="row">
                <label class="toggle grow" data-t-title="cfg.check.deep.hint"><input type="checkbox" id="chkDeep"/><span data-t="cfg.check.deep"></span></label>
                <button class="btn btn-2" id="chkRun"><span class="btn-label" data-t="cfg.check.action"></span></button>
              </div>
              <div class="log tall" id="chkLog"></div>
            </div>
          </div>
        </div>

        <!-- ── the twin of the bench: the bench in 3D as a trial has it, from
             the trial's page and as the Scans step (ui/18-twin.js) ───────── -->
        <div class="view tw-view" data-view="twin">
          <div class="tw-3d" id="tw3d"><canvas id="tw3dCanvas"></canvas><div class="covl tw-hint" data-t="board.3d.hint"></div><div class="tw-msg hidden" id="twMsg"></div></div>
        </div>

        <!-- ── scans and results, its first step: a trial's scans as the scanner exports them, before and
             after the impact, each at its arm position, and what they measure; or a run of scans without an
             impact (the spheres' radii, the repeatability) (ui/22-scans.js) ─────────────────────────────── -->
        <div class="view narrowable" data-view="scans">
          <div class="sheet-col" id="scTrialCol">
            <div class="trial-head">
              <div class="trial-id" id="scId"></div>
              <div class="col grow">
                <div class="trial-sub" id="scSub"></div>
                <div class="row wrap" id="scChips"></div>
              </div>
              <button class="btn btn-2" id="scTwin" type="button" data-t-title="scans.twin.hint"><span data-icon="cube"></span><span class="btn-label" data-t="twin.open"></span></button>
            </div>
            <div class="cards2" id="scSides">
              <div class="card col sc-side"><div class="sc-side-hd"><span class="sec-lbl" data-t="scans.before"></span><span class="sc-side-sub" id="scBeforeSub"></span></div><div class="sc-slots" id="scBefore"></div></div>
              <div class="card col sc-side"><div class="sc-side-hd"><span class="sec-lbl" data-t="scans.after"></span><span class="sc-side-sub" id="scAfterSub"></span></div><div class="sc-slots" id="scAfter"></div></div>
            </div>
            <div class="card col sc-result">
              <div class="row wrap sc-res-hd"><span class="sec-lbl grow" data-t="scans.res.sec"></span><span class="row wrap" id="scResChips"></span></div>
              <div class="sc-res-say hidden" id="scResSay"><span class="spinner spinner-sm hidden" id="scResSpin"></span><span id="scResText"></span></div>
              <div class="stack hidden" id="scResBody">
                <div class="tiles" id="scTiles"></div>
                <div class="tw-legend"><div class="tw-ramp" id="scRamp"></div><div class="tw-ticks" id="scTicks"></div></div>
                <div class="tw-targets" id="scTargets"></div>
              </div>
            </div>
          </div>
          <div class="sheet-col hidden" id="scRun">
            <div class="say card">
              <div class="say-top"><span class="say-title" id="scRunTitle"></span></div>
              <div class="say-line" id="scRunLine"></div>
            </div>
            <div class="count card" id="scRunCount">
              <div class="count-n"><span id="scRunN">0</span><span class="count-of" id="scRunOf"></span></div>
              <div class="progress-track"><div class="progress-fill" id="scRunBar"></div></div>
              <div class="count-say" id="scRunSay"></div>
            </div>
            <div class="sc-grid" id="scRunFiles"></div>
            <div class="card col hidden" id="scRunRes">
              <div class="row wrap"><span class="sec-lbl grow" data-t="scans.run.spread"></span><span id="scRunVerdict"></span></div>
              <div class="tiles" id="scRunTiles"></div>
              <div class="tw-targets" id="scRunTargets"></div>
            </div>
          </div>
          <div class="sheet-col hidden" id="scEmpty">
            <div class="say card">
              <div class="say-top"><span class="say-title" data-t="scans.empty.title"></span></div>
              <div class="say-line" data-t="scans.empty.line"></div>
            </div>
          </div>
        </div>

        <!-- ── scans and results: the steps still to come ──────────────── -->
        <div class="view" data-view="soon">
          <div class="sheet-col">
            <div class="say card">
              <div class="say-top"><span class="say-title" id="soonTitle"></span></div>
              <div class="say-line" id="soonText"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ══ the panel down the right: one page per step, the current one
         carries .show. The common case in plain view; what is rarely needed
         under Advanced, closed until asked for (SlantUI's folds).
         The Phone panel takes its place while it is open, at home too: part
         of the window, never laid over the page. -->
    <div class="rp">

      <!-- the phone: how it is linked, found by itself; Wi-Fi pairing when wanted -->
      <div class="rp-page" data-panel="phone">
        <div class="rp-hd rp-hd-x">
          <div class="rp-title" data-t="link.title"></div>
          <div class="rp-sub" data-t="link.sub"></div>
          <button class="ct rp-x" type="button" id="lkClose" data-t-title="link.close.hint"><span data-icon="win-close"></span></button>
        </div>
        <div class="rp-scroll stack">
          <div class="live-state"><span class="live-dot" id="lkDot"></span><span class="lk-word" id="lkWord"></span></div>
          <div class="note" id="lkWhy"></div>
          <div id="lkRows"></div>
          <button class="btn btn-2 btn-wide" id="lkWifi" data-t-title="link.wifi.hint"><span class="btn-label" data-t="link.wifi.action"></span></button>
          <!-- Wi-Fi pairing, once per PC, only when asked for -->
          <div class="stack hidden" id="lkPair">
            <div class="sec-lbl" data-t="link.pair.sec" data-t-title="link.pair.sec.hint"></div>
            <div class="lk-step" id="lkS1" data-t-title="link.pair.s1.hint"><span class="tn">1</span><span data-t="link.pair.s1"></span></div>
            <div class="lk-step" id="lkS2"><span class="tn">2</span><span data-t="link.pair.s2"></span></div>
            <div class="lk-step"><span class="tn" id="lkS3n">3</span><span data-t="link.pair.s3"></span></div>
            <div class="lk-qr" id="lkQr"></div>
            <div class="row hidden" id="lkQrWait"><span class="spinner spinner-sm"></span><span class="note" data-t="link.pair.qr.wait"></span></div>
            <button class="btn btn-2 btn-wide" id="lkQrBtn"><span class="btn-label" data-t="link.pair.qr.new"></span></button>
          </div>
          <!-- the live view on the phone's own screen -->
          <div class="sec-lbl" data-t="view.sec"></div>
          <button class="btn btn-2 btn-wide" id="vwOpen" data-t-title="view.open.hint"><span data-icon="play"></span><span class="btn-label" data-t="view.open"></span></button>
          <div id="vwRows"></div>
          <div class="fold" id="lkAdv"><button class="fold-hd" type="button"><span class="fold-name" data-t="word.advanced"></span></button><div class="fold-body"><div class="stack">
            <div id="lkMore"></div>
            <button class="btn btn-2 btn-wide" id="lkWifiAgain" data-t-title="link.wifi.hint"><span class="btn-label" data-t="link.wifi.again"></span></button>
            <!-- Wi-Fi: pairing with a code, and connecting by address -->
            <div class="sec-lbl" data-t="link.pair.code.sec" data-t-title="link.pair.code.hint"></div>
            <input class="input" type="text" id="lkPairAddr" data-t-ph="link.pair.addr.ph" data-t-title="link.pair.or"/>
            <input class="input" type="text" id="lkPairCode" inputmode="numeric" maxlength="7" data-t-ph="link.pair.code.ph"/>
            <button class="btn btn-2 btn-wide" id="lkPairBtn"><span class="btn-label" data-t="link.pair.action"></span></button>
            <div class="sec-lbl" data-t="link.connect.sec" data-t-title="link.connect.hint"></div>
            <input class="input" type="text" id="lkAddr" data-t-ph="link.connect.ph" data-t-title="link.connect.note"/>
            <button class="btn btn-2 btn-wide" id="lkConnect"><span class="btn-label" data-t="link.connect.action"></span></button>
            <!-- another screen on the same network: off until asked for (the view then listens on the network), then
                 the code to scan -->
            <div class="sec-lbl" id="vwOtherSec" data-t="view.other.sec"></div>
            <label class="toggle" data-t-title="view.other.hint"><input type="checkbox" id="vwLan"/><span data-t="view.other.on"></span></label>
            <div class="lk-qr" id="vwQr" data-t-title="view.firewall"></div>
            <div class="note" id="vwQrNote" data-t="view.qr.note"></div>
            <div class="note note-path" id="vwUrl"></div>
            <div id="vwMore"></div>
          </div></div></div>
        </div>
      </div>

      <!-- calibration 1: the board. The kind (this monitor or physical); on
           the monitor its size and the ruler check; physical, which one and
           its three caliper readings (ui/15-board.js, both copies) -->
      <div class="rp-page" data-panel="cal-board">
        <div class="rp-hd">
          <div class="rp-title" data-t="cal.board.title"></div>
          <div class="rp-sub" data-t="cal.board.sub"></div>
        </div>
        <div class="rp-scroll stack" id="calBd">
          <div class="mlist" id="calBdKinds">
            <div class="mitem" data-kind="screen" tabindex="0" role="button"><span class="mitem-name" data-t="board.kind.screen"></span></div>
            <div class="mitem" data-kind="physical" tabindex="0" role="button"><span class="mitem-name" data-t="board.kind.physical"></span></div>
          </div>
          <!-- which board makes a clean calibration of the photos, in one line -->
          <div class="note" id="calBdAdvice"></div>
          <div class="stack" id="calBdScreen">
            <div id="calBdRows"></div>
            <div class="callout callout-warn hidden" id="calBdWarn"></div>
