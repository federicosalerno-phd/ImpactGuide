<!DOCTYPE html>
<html lang="en" data-palette="gold-dark">
<head>
<meta charset="UTF-8"/>
<title data-t="win.title"></title>
<!-- SlantUI's stylesheets and scripts are written next to this page by
     impactguide_app.py (prepare_page) in a local copy of it: the page is
     loaded from file:// and can only link what sits beside it. -->
<link rel="stylesheet" href="ui/slantui.css"/>
<link rel="stylesheet" href="ui/app.css"/>
</head>
<body>
<div class="app">

  <!-- The title band. SlantUI's titlebar.js cuts it, writes the credit line
       and wires the three buttons; the page gives the name and the mark,
       which app.css sets from ui/impactguide-mark.svg. -->
  <div class="titlebar">
    <div class="tbar-band"></div>
    <div class="tbar-brand">
      <div class="tbar-logo" id="tbLogo"></div>
      <span class="tbar-name"><b>Impact</b>Guide</span>
    </div>
    <div class="tbar-drag"></div>
    <div class="tbar-btns">
      <div class="wbtn wbtn-min" data-t-title="win.minimise.hint" data-icon="win-minimise"></div>
      <div class="wbtn wbtn-max" data-icon="win-maximise"></div>
      <div class="wbtn wbtn-close" data-t-title="win.close.hint" data-icon="win-close"></div>
    </div>
  </div>

  <!-- The rail: the seven pages of the bench, in the order of the work. All of
       them can be opened; the ones not built yet say so on their page. -->
  <div class="topbar">
    <div class="tabbar" id="rail">
      <div class="tab" data-page="calibration"><div class="tn">1</div><span data-t="page.calibration.title"></span></div>
      <div class="tab" data-page="live"><div class="tn">2</div><span data-t="page.live.title"></span></div>
      <div class="tab" data-page="trials"><div class="tn">3</div><span data-t="page.trials.title"></span></div>
      <div class="tab" data-page="scans"><div class="tn">4</div><span data-t="page.scans.title"></span></div>
      <div class="tab" data-page="analysis"><div class="tn">5</div><span data-t="page.analysis.title"></span></div>
      <div class="tab" data-page="charts"><div class="tn">6</div><span data-t="page.charts.title"></span></div>
      <div class="tab" data-page="dataset"><div class="tn">7</div><span data-t="page.dataset.title"></span></div>
    </div>
    <div class="tb-gap"></div>
    <div class="tb-r">
      <div class="picker" id="lang" tabindex="0" data-t-title="win.lang.hint"></div>
      <!-- the link to the phone, cable or Wi-Fi: the button says which and opens the Phone pane -->
      <button class="btn btn-2 btn-sm" id="lkBtn" type="button" data-t-title="link.btn.hint"><span data-icon="phone"></span><span class="btn-label" id="lkBtnL"></span></button>
      <div class="stpill" id="pill"><div class="sd" id="sd"></div><span id="st"></span></div>
    </div>
  </div>

  <div class="work">
    <div class="main">

      <!-- One toolbar for every page; each page shows its own group. -->
      <div class="toolbar">
        <div class="tool-group" data-for="live">
          <button class="btn btn-2 btn-sm layer-btn" data-layer="face" data-t="live.layer.face"></button>
          <button class="btn btn-2 btn-sm layer-btn" data-layer="mandible" data-t="live.layer.mandible"></button>
          <button class="btn btn-2 btn-sm layer-btn" data-layer="axes" data-t="live.layer.axes"></button>
        </div>
        <div class="tool-group" data-for="trials">
          <button class="btn btn-2 btn-sm view-btn" data-view="guide" data-t="trials.view.guide"></button>
          <button class="btn btn-2 btn-sm view-btn" data-view="log" data-t="trials.view.log"></button>
          <button class="btn btn-2 btn-sm view-btn" data-view="sequence" data-t="trials.view.sequence"></button>
          <button class="btn btn-2 btn-sm view-btn" data-view="config" data-t="trials.view.config"></button>
        </div>
        <span class="cthint" id="hint"></span>
        <span class="chip chip-warn hidden" id="simChip" data-t="win.simulation"></span>
        <span class="ct-fname fit" id="where"></span>
      </div>

      <div class="stage">

        <!-- ── calibration ─────────────────────────────────────────────── -->
        <div class="view" data-view="calibration">
          <div class="sheet-col">
            <div class="cards2" id="calModes"></div>
            <div class="cards2">
              <div class="card col">
                <div class="sec-lbl" data-t="cal.board.sec"></div>
                <div id="calBoard"></div>
                <div class="row" id="calBoardPrint">
                  <button class="btn btn-2 grow" id="calBoardBtn"><span class="btn-label" data-t="cal.board.action"></span></button>
                  <button class="btn btn-2 grow" id="calBoardOpen"><span class="btn-label" data-t="cal.board.open"></span></button>
                </div>
              </div>
              <div class="card col">
                <div class="sec-lbl" data-t="cal.last.sec"></div>
                <div class="row" id="calLastHead"></div>
                <div class="log tall" id="calLog"></div>
              </div>
            </div>
            <div class="sec-lbl" data-t="cal.folders.sec"></div>
            <div class="mlist slim" id="calFolders"></div>
            <div class="note" id="calFoldersNote"></div>
          </div>
        </div>

        <!-- ── live AR: the stream as the backend composes it, at its 4:3,
             with what is not real yet and the status light laid over it ── -->
        <div class="view live-view" data-view="live">
          <div class="live-stage">
            <div class="live-frame">
              <img class="live-img hidden" id="lvImg" alt=""/>
              <div class="covl live-tags hidden" id="lvTags"></div>
              <div class="covl live-lights hidden" id="lvLights">
                <div class="live-light"><span class="live-dot" id="lvDot"></span><span id="lvLight"></span></div>
                <div class="live-light live-later"><span class="live-dot off"></span><span data-t="live.light.check"></span></div>
              </div>
              <div class="czoom hidden" id="lvRate"></div>
              <div class="live-idle" id="lvIdle">
                <div class="done-card card col">
                  <div class="trial-id" id="lvIdleTitle"></div>
                  <div class="note" id="lvIdleText"></div>
                  <div class="row" id="lvIdleWait"><span class="spinner spinner-sm"></span><span class="note" data-t="live.idle.starting"></span></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- ── trials: the guide ───────────────────────────────────────── -->
        <div class="view" data-view="trials-guide">
          <div class="sheet-col fill" id="guide">
            <div class="trial-head">
              <div class="trial-id" id="gId"></div>
              <div class="col grow">
                <div class="trial-sub" id="gSub"></div>
                <div class="row wrap" id="gChips"></div>
              </div>
            </div>
            <div class="tiles" id="gTiles"></div>
            <div class="col" id="gWarn"></div>
            <div class="split">
              <div class="split-main">
                <div class="now card" id="gNow">
                  <div class="now-n" id="gNowN"></div>
                  <div class="now-t" id="gNowT"></div>
                  <div class="now-x" id="gNowX"></div>
                  <div class="preview hidden" id="gPrev"></div>
                </div>
              </div>
              <div class="split-side">
                <div class="sec-lbl" data-t="trials.steps.sec"></div>
                <div class="mlist slim" id="gSteps"></div>
              </div>
            </div>
          </div>
          <div class="sheet-col hidden" id="guideDone">
            <div class="done-card card col">
              <div class="trial-id" data-t="trials.complete.title"></div>
              <div class="note" data-t="trials.complete.sub"></div>
            </div>
          </div>
        </div>

        <!-- ── trials: the log ─────────────────────────────────────────── -->
        <div class="view" data-view="trials-log">
          <div class="sheet-col fill">
            <div class="split">
              <div class="split-main">
                <div class="mlist slim" id="logList"></div>
                <div class="note" id="logNote"></div>
              </div>
              <div class="split-side">
                <div class="card col">
                  <div class="sec-lbl" id="lgDetail"></div>
                  <div id="lgFields"></div>
                </div>
                <div class="card col">
                  <div class="sec-lbl" data-t="log.edits.sec"></div>
                  <div class="stack" id="lgEdits"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- ── trials: the sequence ────────────────────────────────────── -->
        <div class="view" data-view="trials-sequence">
          <div class="sheet-col">
            <div class="seq-grid" id="seqList"></div>
          </div>
        </div>

        <!-- ── trials: the configuration ───────────────────────────────── -->
        <div class="view" data-view="trials-config">
          <div class="sheet-col">
            <div class="cards2">
              <div class="card col">
                <div class="sec-lbl" data-t="cfg.totals.sec"></div>
                <div id="cfgTotals"></div>
              </div>
              <div class="card col">
                <div class="sec-lbl" data-t="cfg.history.sec"></div>
                <div id="cfgHistory"></div>
              </div>
            </div>
            <div class="card col">
              <div class="sec-lbl" data-t="cfg.check.sec"></div>
              <div class="row">
                <label class="toggle grow"><input type="checkbox" id="chkDeep"/><span data-t="cfg.check.deep"></span></label>
                <button class="btn btn-2" id="chkRun"><span class="btn-label" data-t="cfg.check.action"></span></button>
              </div>
              <div class="log tall" id="chkLog"></div>
            </div>
          </div>
        </div>

        <!-- ── pages still to come ─────────────────────────────────────── -->
        <div class="view" data-view="soon">
          <div class="sheet-col">
            <div class="done-card card col">
              <div class="trial-id" id="soonTitle"></div>
              <div class="note" id="soonText"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ══ side panel: one page per view, the current one carries .show ══ -->
    <div class="rp">

      <!-- calibration -->
      <div class="rp-page" data-panel="calibration">
        <div class="rp-hd">
          <div class="rp-title" data-t="page.calibration.title"></div>
          <div class="rp-sub" data-t="page.calibration.sub"></div>
        </div>
        <div class="rp-scroll stack">
          <div class="sec-lbl" data-t="cal.mode.sec"></div>
          <div class="combo" id="calMode" tabindex="0" role="button"><span class="combo-v"></span></div>
          <div class="sec-lbl" data-t="board.sec"></div>
          <div id="calBd">
            <div class="mlist" id="calBdKinds">
              <div class="mitem" data-kind="screen" tabindex="0" role="button"><span class="mitem-name"><span data-t="board.kind.screen"></span></span><span class="mbadge" data-t="board.badge.screen"></span></div>
              <div class="mitem" data-kind="printed" tabindex="0" role="button"><span class="mitem-name"><span data-t="board.kind.printed"></span></span><span class="mbadge">A4</span></div>
            </div>
            <div class="stack" id="calBdScreen">
              <div id="calBdSquare"></div>
              <div class="callout callout-warn hidden" id="calBdWarn"></div>
              <button class="btn btn-2 btn-wide" id="calBdShow"><span data-icon="screen"></span><span class="btn-label" data-t="board.show"></span></button>
              <button class="btn btn-2 btn-wide" id="calBdMoreBtn"><span class="btn-label" data-t="board.more"></span></button>
              <div class="stack hidden" id="calBdMore">
                <div class="sec-lbl" data-t="board.monitor.sec"></div>
                <div class="combo" id="calBdMonitor" tabindex="0" role="button"><span class="combo-v"></span></div>
                <div id="calBdRows"></div>
                <div class="note" id="calBdSure"></div>
                <div class="sec-lbl" data-t="board.ruler.sec"></div>
                <div class="row">
                  <input class="input" type="number" id="calBdRuler" min="50" max="2000" step="0.1"/>
                  <span class="input-unit">mm</span>
                </div>
                <div class="note" id="calBdRulerNote"></div>
                <button class="btn btn-2 btn-wide hidden" id="calBdForget"><span class="btn-label" data-t="board.ruler.forget"></span></button>
              </div>
            </div>
            <div class="stack" id="calBdPrinted">
              <div class="sec-lbl" data-t="cal.square.sec"></div>
              <div class="row">
                <input class="input" type="number" id="calBdLong" min="50" max="1100" step="0.1"/>
                <span class="input-unit">mm</span>
              </div>
              <div class="note" id="calBdLongNote"></div>
            </div>
          </div>
          <div class="sec-lbl" data-t="cal.folder.sec"></div>
          <div class="note note-path" id="calFolder"></div>
          <div class="note hidden" id="calFolderBoard"></div>
          <button class="btn btn-2 btn-wide" id="calNewCal"><span data-icon="add"></span><span class="btn-label" data-t="cal.folder.new"></span></button>
          <button class="btn btn-2 btn-wide" id="calNewChk"><span data-icon="add"></span><span class="btn-label" data-t="cal.folder.check"></span></button>
          <div class="sec-lbl" data-t="cal.photos.sec"></div>
          <div class="pi-row"><span class="pi-l" data-t="cal.photos.count"></span><span id="calCount">0</span></div>
          <button class="btn btn-2 btn-wide" id="calShoot"><span data-icon="camera"></span><span class="btn-label" data-t="cal.photos.shoot"></span></button>
          <div class="row">
            <button class="btn btn-2 grow" id="calImport"><span class="btn-label" data-t="cal.photos.import"></span></button>
            <button class="btn btn-2 grow" id="calOpen"><span class="btn-label" data-t="cal.photos.open"></span></button>
          </div>
        </div>
        <div class="rp-foot">
          <button class="btn btn-2 btn-wide" id="calCheck"><span class="btn-label" data-t="cal.check.action"></span></button>
          <button class="btn btn-2 btn-wide hidden" id="calSave"><span class="btn-label" data-t="cal.save.action"></span></button>
          <button class="btn btn-primary btn-wide" id="calRun"><span class="btn-label" data-t="cal.run.action"></span></button>
        </div>
      </div>

      <!-- live AR -->
      <div class="rp-page" data-panel="live">
        <div class="rp-hd">
          <div class="rp-title" data-t="page.live.title"></div>
          <div class="rp-sub" data-t="page.live.sub"></div>
        </div>
        <div class="rp-scroll stack">
          <div class="sec-lbl" data-t="live.status.sec"></div>
          <div class="live-state"><span class="live-dot" id="lvStDot"></span><span id="lvStWord"></span></div>
          <div id="lvStatus"></div>
          <div class="note" id="lvWhy"></div>
          <div class="sec-lbl" data-t="live.check.sec"></div>
          <div class="live-state live-later"><span class="live-dot off"></span><span class="note" data-t="live.check.note"></span></div>
          <div class="sec-lbl" id="lvSpeedLbl" data-t="live.speed.sec"></div>
          <div id="lvSpeed"></div>
          <div class="note" id="lvLatency"></div>
          <div class="sec-lbl" data-t="live.board.sec"></div>
          <div class="combo" id="lvBoard" tabindex="0" role="button"><span class="combo-v"></span></div>
          <div class="note" id="lvBoardNote"></div>
          <div id="lvBd">
            <div class="mlist" id="lvBdKinds">
              <div class="mitem" data-kind="screen" tabindex="0" role="button"><span class="mitem-name"><span data-t="board.kind.screen"></span></span><span class="mbadge" data-t="board.badge.screen"></span></div>
              <div class="mitem" data-kind="printed" tabindex="0" role="button"><span class="mitem-name"><span data-t="board.kind.printed"></span></span><span class="mbadge">A4</span></div>
            </div>
            <div class="stack" id="lvBdScreen">
              <div id="lvBdSquare"></div>
              <div class="callout callout-warn hidden" id="lvBdWarn"></div>
              <button class="btn btn-2 btn-wide" id="lvBdShow"><span data-icon="screen"></span><span class="btn-label" data-t="board.show"></span></button>
              <button class="btn btn-2 btn-wide" id="lvBdMoreBtn"><span class="btn-label" data-t="board.more"></span></button>
              <div class="stack hidden" id="lvBdMore">
                <div class="sec-lbl" data-t="board.monitor.sec"></div>
                <div class="combo" id="lvBdMonitor" tabindex="0" role="button"><span class="combo-v"></span></div>
                <div id="lvBdRows"></div>
                <div class="note" id="lvBdSure"></div>
                <div class="sec-lbl" data-t="board.ruler.sec"></div>
                <div class="row">
                  <input class="input" type="number" id="lvBdRuler" min="50" max="2000" step="0.1"/>
                  <span class="input-unit">mm</span>
                </div>
                <div class="note" id="lvBdRulerNote"></div>
                <button class="btn btn-2 btn-wide hidden" id="lvBdForget"><span class="btn-label" data-t="board.ruler.forget"></span></button>
              </div>
            </div>
            <div class="stack" id="lvBdPrinted">
              <div class="sec-lbl" data-t="cal.square.sec"></div>
              <div class="row">
                <input class="input" type="number" id="lvBdLong" min="50" max="1100" step="0.1"/>
                <span class="input-unit">mm</span>
              </div>
              <div class="note" id="lvBdLongNote"></div>
            </div>
          </div>
          <div class="sec-lbl" data-t="live.reg.sec"></div>
          <div class="note" id="lvRegNote"></div>
          <button class="btn btn-2 btn-wide" id="lvRegLoad"><span data-icon="open"></span><span class="btn-label" data-t="live.reg.load"></span></button>
          <button class="btn btn-2 btn-wide" id="lvRegDemo"><span class="btn-label" data-t="live.reg.demo"></span></button>
          <div class="sec-lbl" data-t="live.cam.sec"></div>
          <div class="note" id="lvCamNote"></div>
          <div class="note note-path" id="lvCamPath"></div>
          <div class="sec-lbl" data-t="live.phone.sec"></div>
          <div id="lvPhone"></div>
          <button class="btn btn-2 btn-wide" id="lvPhoneBtn"><span data-icon="phone"></span><span class="btn-label" data-t="live.phone.open"></span></button>
        </div>
        <div class="rp-foot">
          <button class="btn btn-2 btn-wide hidden" id="lvStop"><span data-icon="stop"></span><span class="btn-label" data-t="live.stop"></span></button>
          <button class="btn btn-primary btn-wide" id="lvStart"><span data-icon="play"></span><span class="btn-label" data-t="live.start"></span></button>
        </div>
      </div>

      <!-- trials: the next trial, before it starts -->
      <div class="rp-page" data-panel="trials-plan">
        <div class="rp-hd">
          <div class="rp-title" data-t="trials.plan.title"></div>
          <div class="rp-sub" id="planSub"></div>
        </div>
        <div class="rp-scroll stack">
          <label class="toggle"><input type="checkbox" id="planRef"/><span data-t="trials.plan.reference"></span>
            <span class="aside" data-t="trials.plan.reference.aside"></span></label>
          <div class="sec-lbl" data-t="trials.plan.mass.sec"></div>
          <div class="row">
            <input class="input" type="number" id="planMass" min="1" step="0.1"/>
            <span class="input-unit">g</span>
          </div>
          <div class="sec-lbl" data-t="trials.plan.extra.sec"></div>
          <div class="stack hidden" id="extraForm">
            <div class="combo" id="exHolder" tabindex="0" role="button"><span class="combo-v"></span></div>
            <div class="combo" id="exAngle" tabindex="0" role="button"><span class="combo-v"></span></div>
            <div class="combo" id="exDir" tabindex="0" role="button"><span class="combo-v"></span></div>
            <label class="toggle"><input type="checkbox" id="exDrape"/><span data-t="trials.tile.drape"></span></label>
            <div class="row">
              <button class="btn btn-2 grow" id="exApply"><span class="btn-label" data-t="trials.plan.extra.apply"></span></button>
              <button class="btn btn-2 grow" id="exCancel"><span class="btn-label" data-t="trials.plan.extra.cancel"></span></button>
            </div>
          </div>
          <button class="btn btn-2 btn-wide" id="extraBtn"><span class="btn-label" data-t="trials.plan.extra.action"></span></button>
          <div class="sec-lbl" data-t="trials.scanner.sec"></div>
          <div class="note note-path" id="planScanner"></div>
          <button class="btn btn-2 btn-wide" id="planScannerBtn"><span class="btn-label" data-t="trials.scanner.choose"></span></button>
        </div>
        <div class="rp-foot">
          <button class="btn btn-primary btn-wide" id="planStart"><span data-icon="play"></span><span class="btn-label" id="planStartL"></span></button>
        </div>
      </div>

      <!-- trials: a step of the open trial -->
      <div class="rp-page" data-panel="trials-step">
        <div class="rp-hd">
          <div class="rp-title" id="stTitle"></div>
          <div class="rp-sub" id="stSub"></div>
        </div>
        <div class="rp-scroll stack" id="stBody">
          <div class="stack hidden" data-kind="photo">
            <button class="btn btn-2 btn-wide" id="stShoot"><span data-icon="camera"></span><span class="btn-label" data-t="step.ctl.shoot"></span></button>
          </div>
          <div class="stack hidden" data-kind="video">
            <button class="btn btn-2 btn-wide" id="stRec"><span data-icon="play"></span><span class="btn-label" id="stRecL"></span></button>
          </div>
          <div class="stack hidden" data-kind="scan">
            <div class="row" id="stWait"><span class="spinner spinner-sm"></span><span class="note" data-t="step.ctl.waiting"></span></div>
            <div class="note note-path" id="stScanner"></div>
            <button class="btn btn-2 btn-wide" id="stScannerBtn"><span class="btn-label" data-t="trials.scanner.choose"></span></button>
          </div>
          <div class="stack hidden" data-kind="file">
            <button class="btn btn-2 btn-wide" id="stImport"><span class="btn-label" data-t="step.ctl.import"></span></button>
            <button class="btn btn-2 btn-wide hidden" id="stDiscard"><span class="btn-label" data-t="step.ctl.discard"></span></button>
          </div>
          <div class="stack hidden" data-kind="spheres">
            <label class="toggle"><input type="checkbox" id="stSpheres"/><span data-t="step.ctl.spheres"></span></label>
            <div class="sec-lbl" data-t="step.ctl.capshift.sec"></div>
            <div class="row">
              <input class="input" type="number" id="stShift" min="0" step="0.01"/>
              <span class="input-unit">mm</span>
            </div>
            <div class="note" data-t="step.ctl.capshift.note"></div>
          </div>
          <div class="stack hidden" data-kind="close">
            <label class="toggle"><input type="checkbox" id="stSecond"/><span data-t="step.ctl.second"></span></label>
            <label class="toggle"><input type="checkbox" id="stCap"/><span data-t="step.ctl.cap"></span></label>
            <div class="sec-lbl" data-t="step.ctl.notes.sec"></div>
            <textarea class="input" id="stNotes" rows="3"></textarea>
          </div>
          <div class="sec-lbl" data-t="step.ctl.void.sec"></div>
          <input class="input" type="text" id="stVoidReason" data-t-ph="step.ctl.void.ph"/>
          <button class="btn btn-danger btn-wide" id="stVoid"><span class="btn-label" data-t="step.ctl.void.action"></span></button>
        </div>
        <div class="rp-foot">
          <div class="rp-nav">
            <button class="btn btn-2 btn-sq" id="stBack" data-t-title="step.back.hint"><span data-icon="chevron-left"></span></button>
            <button class="btn btn-primary btn-grow" id="stOk"><span class="btn-label" id="stOkL"></span><span data-icon="chevron-right"></span></button>
          </div>
        </div>
      </div>

      <!-- trials: the log -->
      <div class="rp-page" data-panel="trials-log">
        <div class="rp-hd">
          <div class="rp-title" id="lgTitle"></div>
          <div class="rp-sub" id="lgSub"></div>
        </div>
        <div class="rp-scroll stack">
          <div class="sec-lbl" data-t="log.edit.sec"></div>
          <div class="combo" id="lgField" tabindex="0" role="button"><span class="combo-v"></span></div>
          <input class="input" type="text" id="lgValue" data-t-ph="log.edit.value"/>
          <input class="input" type="text" id="lgReason" data-t-ph="log.edit.reason"/>
          <button class="btn btn-2 btn-wide" id="lgSave"><span class="btn-label" data-t="log.edit.action"></span></button>
          <div class="sec-lbl" id="lgVoidLbl" data-t="step.ctl.void.sec"></div>
          <input class="input" type="text" id="lgVoidReason" data-t-ph="step.ctl.void.ph"/>
          <button class="btn btn-danger btn-wide" id="lgVoid"><span class="btn-label" data-t="step.ctl.void.action"></span></button>
        </div>
        <div class="rp-foot">
          <button class="btn btn-2 btn-wide" id="lgOpen"><span data-icon="open"></span><span class="btn-label" data-t="log.open.action"></span></button>
        </div>
      </div>

      <!-- trials: the sequence -->
      <div class="rp-page" data-panel="trials-sequence">
        <div class="rp-hd">
          <div class="rp-title" data-t="trials.view.sequence"></div>
          <div class="rp-sub" data-t="seq.sub"></div>
        </div>
        <div class="rp-scroll stack" id="seqTotals"></div>
      </div>

      <!-- trials: the configuration -->
      <div class="rp-page" data-panel="trials-config">
        <div class="rp-hd">
          <div class="rp-title" data-t="trials.view.config"></div>
          <div class="rp-sub" data-t="cfg.sub"></div>
        </div>
        <div class="rp-scroll stack">
          <div class="sec-lbl" data-t="cfg.phase"></div>
          <div class="combo" id="cfgPhase" tabindex="0" role="button"><span class="combo-v"></span></div>
          <div class="sec-lbl" data-t="cfg.holders"></div>
          <input class="input" type="text" id="cfgHolders"/>
          <div class="sec-lbl" data-t="cfg.angles"></div>
          <input class="input" type="text" id="cfgAngles"/>
          <div class="sec-lbl" data-t="cfg.directions"></div>
          <input class="input" type="text" id="cfgDirections"/>
          <div class="cfg-pair">
            <div class="col"><div class="sec-lbl" data-t="cfg.repetitions"></div><input class="input" type="number" id="cfgReps" min="1" step="1"/></div>
            <div class="col"><div class="sec-lbl" data-t="cfg.drape"></div><input class="input" type="number" id="cfgDrape" min="0" step="1"/></div>
          </div>
          <div class="sec-lbl" data-t="cfg.order"></div>
          <div class="combo" id="cfgOrder" tabindex="0" role="button"><span class="combo-v"></span></div>
          <div class="cfg-pair">
            <div class="col"><div class="sec-lbl" data-t="cfg.run"></div><input class="input" type="number" id="cfgRun" min="1" step="1"/></div>
            <div class="col"><div class="sec-lbl" data-t="cfg.seed"></div><input class="input" type="number" id="cfgSeed" step="1"/></div>
          </div>
          <div class="cfg-pair">
            <div class="col"><div class="sec-lbl" data-t="cfg.washers"></div><input class="input" type="number" id="cfgWashers" min="0" step="1"/></div>
            <div class="col"><div class="sec-lbl" data-t="cfg.reposition"></div><input class="input" type="number" id="cfgRepos" min="0.1" step="0.1"/></div>
          </div>
          <label class="toggle"><input type="checkbox" id="cfgHigh"/><span data-t="cfg.highspeed"></span></label>
          <div class="note" id="cfgPreview"></div>
        </div>
        <div class="rp-foot">
          <button class="btn btn-2 btn-wide" id="cfgReset"><span data-icon="reset"></span><span class="btn-label" data-t="cfg.reset"></span></button>
          <button class="btn btn-primary btn-wide" id="cfgApply"><span class="btn-label" data-t="cfg.apply"></span></button>
        </div>
      </div>

      <!-- pages still to come -->
      <div class="rp-page" data-panel="soon">
        <div class="rp-hd">
          <div class="rp-title" id="soonPanelTitle"></div>
          <div class="rp-sub" data-t="soon.sub"></div>
        </div>
        <div class="rp-scroll stack"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- The phone: the link (cable or Wi-Fi) with its pairing steps, its state and its quality, and the
     live view on the phone's own screen. SlantUI's pane docked down the side of the work area,
     opened from the Phone button on the rail (ui/40-phone.js). -->
<div class="sheet sheet-side" id="lkSheet" role="dialog" aria-labelledby="lkTitle">
  <div class="sheet-hd">
    <div class="sheet-title" id="lkTitle" data-t="link.title"></div>
    <button class="ct" type="button" id="lkClose" data-t-title="link.close.hint"><span data-icon="win-close"></span></button>
  </div>
  <div class="sheet-body">
    <div class="stack">
      <div class="sec-lbl" data-t="link.mode.sec"></div>
      <div class="mlist" id="lkModes">
        <div class="mitem" data-mode="usb" tabindex="0" role="button"><span class="mitem-name"><span data-t="link.mode.usb"></span> <span class="mitem-det" data-t="link.mode.usb.det"></span></span><span class="mbadge">USB</span></div>
        <div class="mitem" data-mode="wifi" tabindex="0" role="button"><span class="mitem-name"><span data-t="link.mode.wifi"></span> <span class="mitem-det" data-t="link.mode.wifi.det"></span></span><span class="mbadge">WI-FI</span></div>
      </div>
      <div class="live-state"><span class="live-dot" id="lkDot"></span><span id="lkWord"></span></div>
      <div class="note" id="lkWhy"></div>
      <div id="lkRows"></div>
      <div class="note" id="lkNote"></div>

      <!-- Wi-Fi, not connected: pairing, once per PC -->
      <div class="stack" id="lkPair">
        <div class="sec-lbl" data-t="link.pair.sec"></div>
        <div class="lk-step"><span class="tn">1</span><span data-t="link.pair.s1"></span></div>
        <div class="lk-step"><span class="tn">2</span><span data-t="link.pair.s2"></span></div>
        <div class="lk-step"><span class="tn">3</span><span data-t="link.pair.s3"></span></div>
        <div class="lk-qr-row">
          <div class="lk-qr" id="lkQr"></div>
          <div class="lk-qr-side">
            <div class="row hidden" id="lkQrWait"><span class="spinner spinner-sm"></span><span class="note" data-t="link.pair.qr.wait"></span></div>
            <button class="btn btn-2" id="lkQrBtn"><span class="btn-label" id="lkQrBtnL"></span></button>
          </div>
        </div>
        <div class="lk-step"><span class="tn">4</span><span data-t="link.pair.or"></span></div>
        <div class="cfg-pair">
          <input class="input" type="text" id="lkPairAddr" data-t-ph="link.pair.addr.ph"/>
          <input class="input" type="text" id="lkPairCode" inputmode="numeric" maxlength="7" data-t-ph="link.pair.code.ph"/>
        </div>
        <button class="btn btn-2 btn-wide" id="lkPairBtn"><span class="btn-label" data-t="link.pair.action"></span></button>
        <div class="note" data-t="link.connect.note"></div>
        <div class="row">
          <input class="input grow" type="text" id="lkAddr" data-t-ph="link.connect.ph"/>
          <button class="btn btn-2" id="lkConnect"><span class="btn-label" data-t="link.connect.action"></span></button>
        </div>
      </div>

      <!-- the live view on the phone's own screen -->
      <div class="sec-lbl" data-t="view.sec"></div>
      <div class="note" data-t="view.note"></div>
      <button class="btn btn-primary btn-wide" id="vwOpen"><span data-icon="play"></span><span class="btn-label" data-t="view.open"></span></button>
      <div id="vwRows"></div>
      <div class="lk-qr-row">
        <div class="lk-qr" id="vwQr"></div>
        <div class="lk-qr-side">
          <div class="note" data-t="view.qr.note"></div>
          <div class="note note-path" id="vwUrl"></div>
          <div class="note" data-t="view.firewall"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="scrim" id="busy">
  <div class="busy-card">
    <div class="spinner"></div>
    <div class="busy-text" id="busyText"></div>
  </div>
</div>

<div class="rz rz-n"  data-edge="n"></div>
<div class="rz rz-s"  data-edge="s"></div>
<div class="rz rz-w"  data-edge="w"></div>
<div class="rz rz-e"  data-edge="e"></div>
<div class="rz rz-nw" data-edge="nw"></div>
<div class="rz rz-ne" data-edge="ne"></div>

</body>
